  <head>
    <meta charset="UTF-8" />

    <title>UniEmoji — Same meanings, any face.</title>
    <meta
      name="description"
      content="统一的 emoji 协议，用一套语义连接不同的表情。查看 emoji 语义及各平台表情对照。"
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳至正文</a>
    <header class="site-nav">
      <a class="wordmark" href="index.html"
        ><span class="brand-mark">u.</span> UniEmoji</a
      >
      <nav aria-label="主导航">
        <a href="index.html" aria-current="page">首页</a
        ><a href="protocol.html">协议文档</a><a href="gallery.html">素材库</a
        ><a href="https://github.com/hellodigua/UniEmoji">GitHub ↗</a>
      </nav>
    </header>
    <main id="main" class="mapping-home">
      <header class="mapping-intro">
        <h1>统一的 emoji 协议，<br />用一套语义连接不同的表情。</h1>
        <p class="english">Same meanings, any face.</p>
        <p>
          AI 用 emoji
          表达语义，应用将它替换为对应的表情图片。含义不变，表情自由切换。
        </p>
      </header>
      <section aria-labelledby="mapping-title">
        <div class="mapping-heading">
          <h2 id="mapping-title">语义与表情对照</h2>
          <p>40 种语义 · 7 个平台 <span>／ — 暂未映射</span></p>
        </div>
        <div
          class="mapping-scroll"
          role="region"
          aria-label="各平台表情语义对照表，可横向滚动"
          tabindex="0"
        >
          <table class="mapping-table" id="mapping-table"></table>
          <p id="mapping-status" role="status">正在加载映射…</p>
          <noscript>请启用 JavaScript 查看表情对照表。</noscript>
        </div>
        <p class="mapping-note">
          平台素材按含义对应，具体表达可能存在差异；空项暂未映射。包格式与接入约定见
          <a href="protocol.html">协议文档</a>。
        </p>
      </section>
    </main>
    <footer class="site-footer">
      <a class="wordmark" href="index.html"
        >UniEmoji <small>Same meanings, any face.</small></a
      >

          >素材权利说明 ↗</a
        >

    </footer>
    <script type="module" src="assets/mapping-home.js"></script>
